# 三维仓库环境配置
# 坐标系：世界坐标系，单位米；原点位于仓库地面中心

environment:
  name: "3D_Warehouse_SingleLeak"
  # 仓库长(x) × 宽(y) × 高(z)
  bounds:
    x: [-10.0, 10.0]
    y: [-8.0, 8.0]
    z: [0.0, 5.0]

  # 仿真控制参数
  dt: 0.1              # 仿真步长（秒）
  max_steps: 10000     # 单轮最大仿真步数

  # 是否启用随机环境生成（每次 reset 根据 seed 重新生成）
  randomize: true

# ------------------------- 随机生成参数 -------------------------
random_generation:
  # 气味源随机位置范围（必须满足机械臂可达性）
  source:
    x_range: [-8.0, 8.0]
    y_range: [-6.0, 6.0]
    z_range: [0.6, 0.9]   # RM65 可达高度

  # 障碍物数量
  num_boxes: 8
  num_cylinders: 4

  # 障碍物尺寸范围
  box_size_ranges:
    length: [1.0, 2.5]
    width: [0.6, 1.5]
    height: [1.0, 2.2]

  cylinder:
    radius_range: [0.12, 0.30]
    length_range: [2.0, 6.0]

  # 安全间距：障碍物之间、障碍物与源、障碍物与机器人初始位置的最小距离
  min_obstacle_gap: 1.2
  min_source_to_obstacle: 1.5
  min_start_to_obstacle: 1.5

  # 机器人默认初始位置（可在 run_search.py 中覆盖）
  default_start: [-7.0, -6.5, 0.0]

# ------------------------- 气味源配置 -------------------------
odor_source:
  # 单个泄漏源位置（可修改以测试不同场景）
  # 高度设为 0.9 m，确保 RM65 机械臂（最大垂直 reach ≈ 1.05 m）可够到
  position: [5.5, 2.5, 0.9]
  # 气味源实体半径（视觉检测用，也表示泄漏口大小）
  radius: 0.08
  # 气体类型（用于传感器模型）
  gas: "ethanol"
  # 释放强度（ppm 基准）
  strength: 3000.0
  # 环境风速向量（m/s），决定烟羽主方向
  wind: [0.5, -0.2, 0.0]

# ------------------------- 气味扩散模型 -------------------------
plume:
  # 使用高斯烟羽叠加湍流的简化三维模型
  model: "gaussian_puff"
  # 背景浓度（ppm）
  background: 0.5
  # 传感器最小可检测浓度（ppm）
  detection_threshold: 5.0
  # 扩散系数（决定浓度随距离衰减）
  diffusion_coefficient: 0.8
  # 湍流强度（0~1，越大烟羽越不规则）
  turbulence: 0.15
  # 时间相关湍流更新周期（秒）
  turbulence_update_interval: 2.0

# ------------------------- 障碍物列表 -------------------------
obstacles:
  # 仓库外墙（仅用于可视化，机器人在 bounds 内运动）
  - name: "north_wall"
    type: "box"
    center: [0.0, 8.05, 2.5]
    size: [20.0, 0.1, 5.0]

  - name: "south_wall"
    type: "box"
    center: [0.0, -8.05, 2.5]
    size: [20.0, 0.1, 5.0]

  - name: "east_wall"
    type: "box"
    center: [10.05, 0.0, 2.5]
    size: [0.1, 16.0, 5.0]

  - name: "west_wall"
    type: "box"
    center: [-10.05, 0.0, 2.5]
    size: [0.1, 16.0, 5.0]

  # 货架/储物柜
  - name: "shelf_A"
    type: "box"
    center: [-4.0, -3.0, 1.0]
    size: [2.0, 0.8, 2.0]

  - name: "shelf_B"
    type: "box"
    center: [2.0, -5.0, 1.0]
    size: [1.5, 1.0, 2.0]

  - name: "shelf_C"
    type: "box"
    center: [5.0, 1.0, 1.0]
    size: [1.0, 2.5, 2.0]

  - name: "shelf_D"
    type: "box"
    center: [-3.0, 4.5, 1.0]
    size: [2.5, 0.8, 2.0]

  # 管道（圆柱体）
  - name: "pipe_1"
    type: "cylinder"
    center: [0.0, 0.0, 2.8]
    axis: [0.0, 1.0, 0.0]
    radius: 0.25
    length: 8.0

  - name: "pipe_2"
    type: "cylinder"
    center: [-6.0, 2.0, 2.5]
    axis: [1.0, 0.0, 0.0]
    radius: 0.20
    length: 6.0

  - name: "pipe_3"
    type: "cylinder"
    center: [7.0, -2.0, 2.0]
    axis: [0.0, 0.0, 1.0]
    radius: 0.18
    length: 3.0

  # 包装箱堆
  - name: "crate_stack_1"
    type: "box"
    center: [-8.5, -6.5, 0.6]
    size: [1.2, 1.2, 1.2]

  - name: "crate_stack_2"
    type: "box"
    center: [8.0, 5.5, 0.6]
    size: [1.0, 1.0, 1.2]
