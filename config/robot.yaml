# UMR 移动小车 + RM65-6F-V 机械臂 参数配置
# 数据来源：机器人参数.txt、RealMan/AgileX 公开规格

robot_name: "UMR_RM65_6F_V"

# ------------------------- 移动小车（AgileX UMR） -------------------------
mobile_base:
  model: "AgileX UMR"
  # 车体尺寸（米）
  length: 0.83          # 长 x
  width: 0.54           # 宽 y
  height: 0.41          # 高 z
  ground_clearance: 0.09 # 离地间隙

  # 运动学限制
  max_linear_speed: 1.5        # m/s
  max_angular_speed: 1.0       # rad/s（全向底盘，可原地旋转）
  max_position_delta: 0.10     # 单步最大平移量（仿真步长控制）
  max_yaw_delta: 0.15          # 单步最大偏航角变化（rad）

  # 四个角固定气味传感器相对车体中心的位置（车体坐标系，单位：米）
  corner_sensors:
    front_left:  [ 0.415,  0.270, 0.05 ]
    front_right: [ 0.415, -0.270, 0.05 ]
    rear_left:   [-0.415,  0.270, 0.05 ]
    rear_right:  [-0.415, -0.270, 0.05 ]

# ------------------------- 机械臂（RealMan RM65-6F-V） -------------------------
arm:
  model: "RM65-6F-V"
  dof: 6
  base_height: 0.41     # 机械臂底座安装在小车顶部的高度（m）
  base_offset: [0.0, 0.0, 0.41]  # 机械臂基座相对小车中心的位置
  working_radius: 0.6385  # 最大工作半径（m）

  # 关节限位（度），与真实硬件一致
  joint_limits_deg:
    j1: [-178.0, 178.0]
    j2: [-130.0, 130.0]
    j3: [-135.0, 135.0]
    j4: [-178.0, 178.0]
    j5: [-128.0, 128.0]
    j6: [-360.0, 360.0]

  # 关节最大角速度（度/秒）
  max_joint_speed:
    j1: 180.0
    j2: 180.0
    j3: 225.0
    j4: 225.0
    j5: 225.0
    j6: 225.0

  # 末端气味传感器相对法兰盘（flange）的偏移（m）
  # 传感器朝向前方，便于指向气味源
  ee_sensor_offset: [0.0, 0.0, 0.03]

  # 视觉相机参数（RM65-6F-V 末端集成深度/视觉相机）
  camera:
    # 相机安装在法兰盘上，与气味传感器同方向
    offset: [0.0, 0.0, 0.02]
    # 水平/垂直视场角（度）
    fov_horizontal_deg: 80.0
    fov_vertical_deg: 60.0
    # 最大可探测距离（m）
    max_range: 3.0
    # 光源实体半径（用于判断可见性）
    source_visible_radius: 0.08

  # Modified D-H 参数（RealMan 官方参数，RM65-6F-V d6=184 mm）
  # 表头：a_{i-1}(mm), alpha_{i-1}(deg), d_i(mm), theta_i_offset(deg)
  mdh:
    - {a:   0.0, alpha:   0.0, d: 240.5, theta_offset:   0.0}   # J1
    - {a:   0.0, alpha:  90.0, d:   0.0, theta_offset:  90.0}   # J2
    - {a: 256.0, alpha:   0.0, d:   0.0, theta_offset:  90.0}   # J3
    - {a:   0.0, alpha:  90.0, d: 210.0, theta_offset:   0.0}   # J4
    - {a:   0.0, alpha: -90.0, d:   0.0, theta_offset:   0.0}   # J5
    - {a:   0.0, alpha:  90.0, d: 184.0, theta_offset:   0.0}   # J6

  # 为简化仿真与控制，提供一组常用“臂展”姿态的关节角度参考（度）
  # 这些姿态用于在随机游走时快速抬升末端高度
  preset_poses:
    low:   [0.0, 45.0, 60.0, 0.0, 90.0, 0.0]
    mid:   [0.0, 30.0, 45.0, 0.0, 105.0, 0.0]
    high:  [0.0, 0.0, 30.0, 0.0, 150.0, 0.0]
