# 8×8 m 空仓库环境（无内部障碍物），用于 OdorSim/GADEN 快速验证。

environment:
  name: "Warehouse_Empty_8x8"
  bounds:
    x: [-4.0, 4.0]
    y: [-4.0, 4.0]
    z: [0.0, 3.0]

  dt: 0.05
  max_steps: 10000

  randomize: true

random_generation:
  source:
    x_range: [-2.0, 3.0]
    y_range: [-2.0, 3.0]
    z_range: [0.5, 0.9]

  num_boxes: 0
  num_cylinders: 0

  min_obstacle_gap: 1.2
  min_source_to_obstacle: 1.5
  min_start_to_obstacle: 1.5

  default_start: [-3.0, -3.0, 0.0]

odor_source:
  position: [2.0, 1.0, 0.8]
  radius: 0.08
  gas: "ethanol"
  strength: 3000.0
  wind: [0.3, -0.1, 0.0]

plume:
  model: "gaden"
  background: 0.0
  detection_threshold: 5.0
  diffusion_coefficient: 0.8
  turbulence: 0.0
  turbulence_update_interval: 2.0

obstacles:
  - name: "north_wall"
    type: "box"
    center: [0.0, 4.05, 1.5]
    size: [8.0, 0.1, 3.0]

  - name: "south_wall"
    type: "box"
    center: [0.0, -4.05, 1.5]
    size: [8.0, 0.1, 3.0]

  - name: "east_wall"
    type: "box"
    center: [4.05, 0.0, 1.5]
    size: [0.1, 8.0, 3.0]

  - name: "west_wall"
    type: "box"
    center: [-4.05, 0.0, 1.5]
    size: [0.1, 8.0, 3.0]
